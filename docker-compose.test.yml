# dormant コンテナ内動作の検証用 compose
# 同一ネットワーク (dormant-net) に dormant とテストWebを配置する

services:
  dormant:
    build: .
    container_name: dormant-test-proxy
    volumes:
      - /run/user/1000/docker.sock:/var/run/docker.sock
      - ./dormant.docker.yml:/etc/dormant/dormant.yml
    networks:
      - dormant-net
    ports:
      - "18000:18000"

  web:
    image: nginx:alpine
    container_name: dormant-test-webb
    labels:
      dormant.enable: "true"
      dormant.port: "80"
      dormant.session-duration: "2m"
    networks:
      - dormant-net

networks:
  dormant-net:
    name: dormant-net
